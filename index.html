<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SOS Chaves</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="topo">
            <div class="logo"><span class="quadrado">SOS</span><span class="nome">CHAVES</span></div>
            <button id="btnNoturno">🌙 Modo noturno</button>
        </div>

        <p class="telefone">📞 0800 123 4567</p>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#precos">Preços</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <main>

        <section id="inicio">
            <h1>Ficou para fora? Resolvemos agora!</h1>
            <p>Chaveiro residencial e automotivo 24 horas.</p>
        </section>

        <section id="precos">
            <h2>Simule seu orçamento</h2>

            <label>Tipo de serviço:</label>
            <select id="servico">
                <option value="">Selecione...</option>
                <option value="residencial">Residencial</option>
                <option value="automotivo">Automotivo</option>
            </select>

            <p>Preço base: <strong id="precoBase">R$ --</strong></p>

            <label>Distância (KM):</label>
            <input type="number" id="distancia" placeholder="Ex.: 5">

            <button id="btnCalcular">Calcular</button>

            <p id="resultado"></p>
        </section>

        <section id="contato">
            <h2>Precisa agora?</h2>
            <button id="btnChamar">🔑 Chamar Chaveiro</button>

            <div id="areaSucesso"></div>
        </section>

    </main>

    <footer>
        <p>© 2026 SOS Chaves - Todos os direitos reservados.</p>
        <p>Instagram | Facebook | WhatsApp</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
